# Keep all classes, interfaces, and enums along with their members (fields and methods).

# Prevent ProGuard from changing the names of classes, fields, methods, and enums.
-keep enum cz.empatix.** { *; }
-dontoptimize
-dontshrink

-keep @interface cz.empatix.enemies.domain.SpawnableEnemy
-keepclassmembers class * {
